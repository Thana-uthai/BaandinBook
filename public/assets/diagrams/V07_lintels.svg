<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-labelledby="t d" font-family="Sarabun, 'Noto Sans Thai', Tahoma, sans-serif" font-size="18">
  <title id="t">V07 ลักษณะของทับหลังในแบบต่าง ๆ</title>
  <desc id="d">ภาพตัดแสดงทับหลังเหนือช่องเปิด ๔ แบบตามต้นฉบับ: (๑) ทับหลังแบบเรียบ น้ำฝนไหลตามผิวเข้าใต้ทับหลัง เครื่องหมาย ✗; (๒) ทับหลังที่มีบัวหยดน้ำและแผ่นไม้ น้ำหยดพ้นผนัง เครื่องหมาย ✓; (๓) ทับหลังไม้ท่อนใหญ่ เครื่องหมาย ✓; (๔) ทับหลังไม้ท่อนเล็กหลายท่อน เครื่องหมาย ✓. ข้อความข้างภาพในหนังสือระบุว่าทับหลังควรกว้างอย่างน้อย ๑๕ เซนติเมตร. ที่มา: ภาพลายเส้นต้นฉบับ PDF 055 / หนังสือหน้า ๑๐๗ · วาดใหม่ตามผลตรวจเทียบสแกน C5 (ChatGPT) · EDITORIAL (D008)</desc>
  <defs>
    <symbol id="ok" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#2e7d32"/><polyline points="10,21 17,28 30,13" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="no" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#c62828"/><path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b7dd8"/></marker>
    <pattern id="earth" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#d9b38c"/><path d="M0 14 L14 0" stroke="#a9794a" stroke-width="1.5"/></pattern>
    <pattern id="wood" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#a9703c"/><path d="M0 3 H10" stroke="#7a4c22" stroke-width="1"/></pattern>
    <!-- shared panel scaffold: wall section above the opening, the opening below; outside is on the left -->
    <g id="rain"><line x1="40" y1="56" x2="32" y2="76"/><line x1="70" y1="66" x2="62" y2="86"/><line x1="100" y1="54" x2="92" y2="74"/><line x1="55" y1="92" x2="47" y2="112"/><line x1="85" y1="100" x2="77" y2="120"/></g>
  </defs>
  <rect width="900" height="800" fill="#fff"/>
  <text x="450" y="34" text-anchor="middle" font-weight="700" font-size="21">ลักษณะของทับหลังในแบบต่าง ๆ (ภาพตัด · ด้านนอกอยู่ทางซ้าย)</text>

  <!-- ===== Panel 1: plain lintel (✗) ===== -->
  <g transform="translate(20 50)">
    <text x="215" y="24" text-anchor="middle" font-weight="700">๑. ทับหลังแบบเรียบ</text>
    <g stroke="#9ec5ee" stroke-width="2" stroke-linecap="round"><use href="#rain"/></g>
    <text x="70" y="200" text-anchor="middle" font-size="14" fill="#555">ภายนอก</text>
    <text x="360" y="200" text-anchor="middle" font-size="14" fill="#555">ภายใน</text>
    <!-- wall above opening -->
    <rect x="150" y="50" width="130" height="100" fill="url(#earth)" stroke="#5a3b1c" stroke-width="2"/>
    <!-- plain flat lintel flush with the wall face -->
    <rect x="150" y="150" width="130" height="24" fill="url(#wood)" stroke="#3d2a16" stroke-width="2"/>
    <text x="300" y="168" font-size="13" fill="#3d2a16">ทับหลังเรียบ</text>
    <!-- opening / window below -->
    <rect x="150" y="174" width="130" height="130" fill="#fff" stroke="#5a3b1c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="215" y1="178" x2="215" y2="300" stroke="#8a5a2b" stroke-width="5"/>
    <text x="215" y="325" text-anchor="middle" font-size="13" fill="#555">ช่องเปิด (ประตู/หน้าต่าง)</text>
    <!-- water runs down the face and follows the underside inward -->
    <g stroke="#3b7dd8" stroke-width="3" fill="none" marker-end="url(#arr)">
      <path d="M148 60 L148 172 Q150 184 170 186 L205 190"/>
    </g>
    <text x="215" y="350" text-anchor="middle" fill="#c62828" font-weight="700">น้ำไหลตามผิวเข้าใต้ทับหลัง</text>
    <use href="#no" x="370" y="40" width="44" height="44"/>
  </g>

  <!-- ===== Panel 2: drip moulding + wood board (✓) ===== -->
  <g transform="translate(460 50)">
    <text x="215" y="24" text-anchor="middle" font-weight="700">๒. ทับหลังมีบัวหยดน้ำและแผ่นไม้</text>
    <g stroke="#9ec5ee" stroke-width="2" stroke-linecap="round"><use href="#rain"/></g>
    <text x="70" y="200" text-anchor="middle" font-size="14" fill="#555">ภายนอก</text>
    <text x="360" y="200" text-anchor="middle" font-size="14" fill="#555">ภายใน</text>
    <rect x="150" y="50" width="130" height="100" fill="url(#earth)" stroke="#5a3b1c" stroke-width="2"/>
    <!-- wood board lintel projecting slightly beyond the wall face -->
    <rect x="130" y="150" width="150" height="20" fill="url(#wood)" stroke="#3d2a16" stroke-width="2"/>
    <text x="300" y="166" font-size="13" fill="#3d2a16">แผ่นไม้</text>
    <!-- drip moulding (บัวหยดน้ำ) under the outer edge of the board -->
    <path d="M130 170 L130 186 Q140 190 150 180 L150 170 Z" fill="#8a5a2b" stroke="#3d2a16" stroke-width="2"/>
    <line x1="128" y1="192" x2="100" y2="215" stroke="#333" stroke-width="1"/>
    <text x="96" y="230" text-anchor="end" font-size="13" fill="#333">บัวหยดน้ำ</text>
    <rect x="150" y="174" width="130" height="130" fill="#fff" stroke="#5a3b1c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="215" y1="178" x2="215" y2="300" stroke="#8a5a2b" stroke-width="5"/>
    <text x="215" y="325" text-anchor="middle" font-size="13" fill="#555">ช่องเปิด (ประตู/หน้าต่าง)</text>
    <!-- water runs down the face, reaches the moulding and drips clear -->
    <g stroke="#3b7dd8" stroke-width="3" fill="none"><path d="M148 60 L148 150 L130 152 L130 186"/></g>
    <g fill="#3b7dd8"><ellipse cx="131" cy="206" rx="3.5" ry="6"/><ellipse cx="131" cy="236" rx="3.5" ry="6"/><ellipse cx="131" cy="266" rx="3.5" ry="6"/></g>
    <text x="215" y="350" text-anchor="middle" fill="#2e7d32" font-weight="700">น้ำหยดพ้นผนัง</text>
    <use href="#ok" x="370" y="40" width="44" height="44"/>
  </g>

  <!-- ===== Panel 3: large log (✓) ===== -->
  <g transform="translate(20 420)">
    <text x="215" y="24" text-anchor="middle" font-weight="700">๓. ทับหลังไม้ท่อนใหญ่</text>
    <g stroke="#9ec5ee" stroke-width="2" stroke-linecap="round"><use href="#rain"/></g>
    <text x="70" y="200" text-anchor="middle" font-size="14" fill="#555">ภายนอก</text>
    <text x="360" y="200" text-anchor="middle" font-size="14" fill="#555">ภายใน</text>
    <rect x="150" y="50" width="130" height="80" fill="url(#earth)" stroke="#5a3b1c" stroke-width="2"/>
    <!-- one large round log spanning the wall thickness -->
    <circle cx="215" cy="160" r="46" fill="#a9703c" stroke="#3d2a16" stroke-width="2"/>
    <circle cx="215" cy="160" r="30" fill="none" stroke="#7a4c22" stroke-width="1.5"/>
    <circle cx="215" cy="160" r="14" fill="none" stroke="#7a4c22" stroke-width="1.5"/>
    <text x="300" y="166" font-size="13" fill="#3d2a16">ไม้ท่อนใหญ่</text>
    <rect x="150" y="206" width="130" height="98" fill="#fff" stroke="#5a3b1c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="215" y1="210" x2="215" y2="300" stroke="#8a5a2b" stroke-width="5"/>
    <text x="215" y="325" text-anchor="middle" font-size="13" fill="#555">ช่องเปิด (ประตู/หน้าต่าง)</text>
    <!-- water runs down the face, follows the log curve and drips at its outer bottom -->
    <g stroke="#3b7dd8" stroke-width="3" fill="none"><path d="M148 60 L148 134 Q160 130 170 150"/></g>
    <g fill="#3b7dd8"><ellipse cx="176" cy="212" rx="3.5" ry="6"/><ellipse cx="176" cy="242" rx="3.5" ry="6"/></g>
    <use href="#ok" x="370" y="40" width="44" height="44"/>
  </g>

  <!-- ===== Panel 4: small logs (✓) ===== -->
  <g transform="translate(460 420)">
    <text x="215" y="24" text-anchor="middle" font-weight="700">๔. ทับหลังไม้ท่อนเล็ก</text>
    <g stroke="#9ec5ee" stroke-width="2" stroke-linecap="round"><use href="#rain"/></g>
    <text x="70" y="200" text-anchor="middle" font-size="14" fill="#555">ภายนอก</text>
    <text x="360" y="200" text-anchor="middle" font-size="14" fill="#555">ภายใน</text>
    <rect x="150" y="50" width="130" height="92" fill="url(#earth)" stroke="#5a3b1c" stroke-width="2"/>
    <!-- several small round logs laid side by side across the wall thickness -->
    <g fill="#a9703c" stroke="#3d2a16" stroke-width="2">
      <circle cx="172" cy="162" r="20"/><circle cx="215" cy="162" r="20"/><circle cx="258" cy="162" r="20"/>
    </g>
    <g fill="none" stroke="#7a4c22" stroke-width="1.5"><circle cx="172" cy="162" r="10"/><circle cx="215" cy="162" r="10"/><circle cx="258" cy="162" r="10"/></g>
    <text x="300" y="166" font-size="13" fill="#3d2a16">ไม้ท่อนเล็ก</text>
    <rect x="150" y="182" width="130" height="122" fill="#fff" stroke="#5a3b1c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="215" y1="186" x2="215" y2="300" stroke="#8a5a2b" stroke-width="5"/>
    <text x="215" y="325" text-anchor="middle" font-size="13" fill="#555">ช่องเปิด (ประตู/หน้าต่าง)</text>
    <g stroke="#3b7dd8" stroke-width="3" fill="none"><path d="M148 60 L148 142 Q156 148 160 168"/></g>
    <g fill="#3b7dd8"><ellipse cx="160" cy="196" rx="3.5" ry="6"/><ellipse cx="160" cy="226" rx="3.5" ry="6"/></g>
    <use href="#ok" x="370" y="40" width="44" height="44"/>
  </g>

  <!-- footer: adjacent book text + provenance -->
  <text x="450" y="770" text-anchor="middle" font-size="14" fill="#555">ข้อความข้างภาพในหนังสือ: ทับหลังควรกว้างอย่างน้อย ๑๕ ซม.</text>
  <text x="450" y="792" text-anchor="middle" font-size="14" fill="#555">ที่มา: หนังสือหน้า ๑๐๗ (PDF 055) · วาดใหม่ตามผลตรวจต้นฉบับ C5 · EDITORIAL (D008)</text>
</svg>
