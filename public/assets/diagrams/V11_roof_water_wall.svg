<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Sarabun, 'Noto Sans Thai', Tahoma, sans-serif" font-size="18">
  <title id="t">V11 ระวังน้ำที่ไหลจากหลังคาโดนผนังดิน จะทำให้พังเร็ว</title>
  <desc id="d">ภาพเตือนตามต้นฉบับ (เครื่องหมาย ✗): หลังคาจั่วสองส่วนที่อยู่ติดกัน ชายคาด้านในของทั้งสองหลังคาหันเข้าหากัน น้ำฝนที่ไหลจากหลังคาจึงตกลงปะทะผนังดินที่อยู่ระหว่างกลาง น้ำขังและกระเซ็นที่หัวผนัง ทำให้ผนังดินพังเร็ว. ต้นฉบับมีเฉพาะภาพเตือนนี้ ไม่มีภาพเปรียบเทียบแบบถูกต้อง. ที่มา: ภาพลายเส้นต้นฉบับ PDF 059 / หนังสือหน้า ๑๑๕ รูปล่างขวา · วาดใหม่ตามผลตรวจเทียบสแกน C5 (ChatGPT) · EDITORIAL (D008)</desc>
  <defs>
    <symbol id="no" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#c62828"/><path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b7dd8"/></marker>
    <pattern id="earth" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9b38c"/><path d="M0 12 L12 0" stroke="#a9794a" stroke-width="1.5"/></pattern>
  </defs>
  <rect width="800" height="420" fill="#fff"/>
  <!-- caption verbatim from the book figure -->
  <text x="400" y="34" text-anchor="middle" font-weight="700">ระวังน้ำที่ไหลจากหลังคาโดนผนังดิน จะทำให้พังเร็ว</text>
  <!-- rain across the whole scene -->
  <g stroke="#9ec5ee" stroke-width="2" stroke-linecap="round">
    <g id="rain"><line x1="60" y1="60" x2="50" y2="84"/><line x1="100" y1="70" x2="90" y2="94"/><line x1="140" y1="56" x2="130" y2="80"/><line x1="180" y1="72" x2="170" y2="96"/><line x1="220" y1="58" x2="210" y2="82"/><line x1="260" y1="74" x2="250" y2="98"/><line x1="300" y1="60" x2="290" y2="84"/><line x1="340" y1="76" x2="330" y2="100"/><line x1="380" y1="62" x2="370" y2="86"/></g>
    <use href="#rain" x="340"/>
    <use href="#rain" x="20" y="40"/>
    <use href="#rain" x="360" y="40"/>
  </g>
  <!-- ground -->
  <rect x="20" y="340" width="760" height="14" fill="#333"/>
  <!-- LEFT building portion -->
  <rect x="90" y="222" width="230" height="118" fill="#f3e9dc" stroke="#5a3b1c" stroke-width="2"/>
  <path d="M60 232 L205 118 L352 232" fill="none" stroke="#5a3b1c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M60 232 L205 118 L352 232 L340 232 L205 130 L72 232 Z" fill="#c98a4c"/>
  <!-- RIGHT building portion -->
  <rect x="480" y="222" width="230" height="118" fill="#f3e9dc" stroke="#5a3b1c" stroke-width="2"/>
  <path d="M448 232 L595 118 L740 232" fill="none" stroke="#5a3b1c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M448 232 L595 118 L740 232 L728 232 L595 130 L460 232 Z" fill="#c98a4c"/>
  <!-- earthen wall standing between the two roof portions -->
  <rect x="372" y="214" width="56" height="126" fill="url(#earth)" stroke="#5a3b1c" stroke-width="2"/>
  <!-- water collecting on top of the wall between the inner eaves -->
  <path d="M352 232 q10 -12 20 -6 q10 -10 28 -6 q10 -8 20 -2 q10 -10 28 14 L428 232 Z" fill="#7fb3e6" opacity="0.85"/>
  <!-- runoff from both inner roof slopes into the gap -->
  <g stroke="#3b7dd8" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M300 150 L348 222"/>
    <path d="M500 150 L452 222"/>
  </g>
  <!-- water running down the wall faces and splashing -->
  <g stroke="#3b7dd8" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M366 236 q-6 14 0 28 q-6 14 0 28 q-6 12 0 24"/>
    <path d="M434 236 q6 14 0 28 q6 14 0 28 q6 12 0 24"/>
    <path d="M344 240 l-12 10"/><path d="M456 240 l12 10"/>
    <path d="M338 262 l-10 12"/><path d="M462 262 l10 12"/>
  </g>
  <g fill="#3b7dd8">
    <ellipse cx="330" cy="300" rx="4" ry="6"/><ellipse cx="322" cy="326" rx="3.5" ry="5"/><ellipse cx="470" cy="300" rx="4" ry="6"/><ellipse cx="478" cy="326" rx="3.5" ry="5"/>
    <ellipse cx="352" cy="320" rx="3" ry="5"/><ellipse cx="448" cy="320" rx="3" ry="5"/>
  </g>
  <!-- erosion at the base of the wall -->
  <g fill="#b58a5e" stroke="#5a3b1c" stroke-width="1"><path d="M372 300 q-10 8 -4 18 q-8 10 2 22 L372 340 Z"/><path d="M428 300 q10 8 4 18 q8 10 -2 22 L428 340 Z"/></g>
  <!-- labels (editorial, minimal) -->
  <text x="400" y="372" text-anchor="middle" font-size="15" fill="#c62828">น้ำจากหลังคาทั้งสองด้านไหลลงโดนผนังดินที่อยู่ระหว่างกลาง</text>
  <text x="400" y="398" text-anchor="middle" font-size="14" fill="#555">ที่มา: หนังสือหน้า ๑๑๕ (PDF 059) · ต้นฉบับมีเฉพาะภาพเตือน (เครื่องหมาย ✗) · วาดใหม่ · EDITORIAL (D008)</text>
  <!-- source symbol 8 → ✗ -->
  <use href="#no" x="700" y="150" width="52" height="52"/>
</svg>
