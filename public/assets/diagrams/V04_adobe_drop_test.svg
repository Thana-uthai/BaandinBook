<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="Sarabun, 'Noto Sans Thai', Tahoma, sans-serif" font-size="18">
  <title id="t">V04 การทดสอบคุณภาพอิฐดินดิบ (Drop Test)</title>
  <desc id="d">ภาพเปรียบเทียบการทดสอบความแข็งแรงของอิฐดินดิบ ยกอิฐสุดแขนแล้วปล่อยตกกระทบพื้น ก้อนที่บิ่นแค่มุมถือว่าผ่าน (✓) ก้อนที่แตกละเอียดถือว่าไม่ได้มาตรฐาน (✗). ที่มา: ภาพลายเส้นต้นฉบับ PDF 042 / หนังสือหน้า ๘๑ · วาดใหม่ตามสเปก G3 · EDITORIAL (D008)</desc>
  <defs>
    <symbol id="ok" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#2e7d32"/><polyline points="10,21 17,28 30,13" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="no" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#c62828"/><path d="M12 12 L28 28 M28 12 L12 28" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
  </defs>
  <rect width="800" height="420" fill="#fff"/>
  <text x="400" y="34" text-anchor="middle" font-weight="700" font-size="20">ยกอิฐขึ้นสุดแขน แล้วปล่อยให้ตกกระทบพื้น</text>
  <!-- ground -->
  <line x1="40" y1="340" x2="760" y2="340" stroke="#555" stroke-width="3"/>
  <g stroke="#999"><line x1="60" y1="352" x2="740" y2="352" stroke-dasharray="4 6"/></g>
  <!-- LEFT panel -->
  <g>
    <!-- brick in hand at top -->
    <rect x="150" y="60" width="90" height="40" fill="#c89a6a" stroke="#5a3b1c" stroke-width="2.5"/>
    <text x="195" y="128" text-anchor="middle" font-size="15">ยกสุดแขน</text>
    <line x1="195" y1="140" x2="195" y2="250" stroke="#333" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arr)"/>
    <!-- brick on ground chipped corner -->
    <path d="M140 300 L240 300 L240 340 L160 340 L140 320 Z" fill="#c89a6a" stroke="#5a3b1c" stroke-width="2.5"/>
    <path d="M140 320 L160 340" stroke="#5a3b1c" stroke-width="2.5"/>
    <g fill="#c89a6a" stroke="#5a3b1c"><path d="M120 330 l8 -6 l6 10 z"/><path d="M128 338 l6 -5 l4 7 z"/></g>
    <text x="195" y="385" text-anchor="middle" font-weight="700">บิ่นหรือหักเฉพาะมุม — ใช้ได้</text>
    <use href="#ok" x="260" y="290" width="48" height="48"/>
  </g>
  <line x1="400" y1="50" x2="400" y2="400" stroke="#bbb" stroke-dasharray="8 6"/>
  <!-- RIGHT panel -->
  <g>
    <rect x="555" y="60" width="90" height="40" fill="#c89a6a" stroke="#5a3b1c" stroke-width="2.5"/>
    <text x="600" y="128" text-anchor="middle" font-size="15">ยกสุดแขน</text>
    <line x1="600" y1="140" x2="600" y2="250" stroke="#333" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arr)"/>
    <!-- shattered pieces -->
    <g fill="#c89a6a" stroke="#5a3b1c" stroke-width="2">
      <path d="M520 340 L560 305 L575 340 Z"/><path d="M575 340 L590 300 L625 320 L615 340 Z"/><path d="M630 340 L650 310 L680 340 Z"/>
      <path d="M545 300 L565 285 L580 300 Z"/><path d="M600 290 L625 280 L635 300 Z"/><path d="M500 338 l10 -8 l6 8 z"/><path d="M690 336 l8 -9 l8 9 z"/>
    </g>
    <text x="600" y="385" text-anchor="middle" font-weight="700">แตกหักทั้งก้อน — ใช้ไม่ได้</text>
    <use href="#no" x="665" y="290" width="48" height="48"/>
  </g>
</svg>
